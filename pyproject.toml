[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "atlas"
version = "0.0.1"
description = "Automated Toolkit for Language Data Assessment and Scoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Dr. Balayogi" }
]

dependencies = [
    "typer",
    "rich",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]
formats = [
    "pandas",
    "openpyxl",
    "pyarrow",
]


[project.scripts]
atlas = "atlas.cli.main:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
